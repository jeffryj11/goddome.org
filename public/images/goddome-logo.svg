<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">God Dome Radiant Cross Logo</title>
  <desc id="desc">Radiant gold cross above a gold dome arc with golden God Dome lettering and sparkles on a transparent background.</desc>
  <defs>
    <radialGradient id="crossGlow" cx="50%" cy="33%" r="34%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="22%" stop-color="#fff2a9"/>
      <stop offset="52%" stop-color="#ffc928" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffbf00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7c7"/>
      <stop offset="26%" stop-color="#ffde62"/>
      <stop offset="52%" stop-color="#b97816"/>
      <stop offset="76%" stop-color="#ffef9c"/>
      <stop offset="100%" stop-color="#8f5712"/>
    </linearGradient>
    <linearGradient id="arcGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f5712"/>
      <stop offset="20%" stop-color="#fff0a1"/>
      <stop offset="50%" stop-color="#d59622"/>
      <stop offset="82%" stop-color="#fff0a1"/>
      <stop offset="100%" stop-color="#8f5712"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 1 0 0 .68  0 0 1 0 .08  0 0 0 .9 0" result="goldglow"/>
      <feMerge><feMergeNode in="goldglow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#6b3c00" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="1" flood-color="#fff4bd" flood-opacity="0.9"/>
    </filter>
    <filter id="sparkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="transparent"/>
  <circle cx="768" cy="325" r="300" fill="url(#crossGlow)"/>

  <g filter="url(#softGlow)">
    <path d="M742 205h52v217h-52z" fill="#ffe45f" stroke="#fff7c7" stroke-width="4"/>
    <path d="M665 287h206v42H665z" fill="#ffe45f" stroke="#fff7c7" stroke-width="4"/>
  </g>

  <g stroke="#ffd24a" stroke-linecap="round" opacity="0.7" filter="url(#sparkGlow)">
    <path d="M768 78v140" stroke-width="3"/>
    <path d="M768 432v115" stroke-width="3"/>
    <path d="M538 308h145" stroke-width="3"/>
    <path d="M852 308h150" stroke-width="3"/>
    <path d="M612 152l104 118" stroke-width="2"/>
    <path d="M925 152L820 270" stroke-width="2"/>
    <path d="M555 213l142 75" stroke-width="2"/>
    <path d="M982 215l-142 73" stroke-width="2"/>
    <path d="M654 92l82 154" stroke-width="1.8"/>
    <path d="M884 94l-83 152" stroke-width="1.8"/>
  </g>

  <g fill="#ffd34d" filter="url(#sparkGlow)">
    <path d="M318 585l13 40 13-40 40-13-40-13-13-40-13 40-40 13z" opacity="0.9"/>
    <path d="M441 480l9 28 9-28 28-9-28-9-9-28-9 28-28 9z" opacity="0.85"/>
    <path d="M552 398l11 36 11-36 36-11-36-11-11-36-11 36-36 11z" opacity="0.9"/>
    <path d="M965 398l11 36 11-36 36-11-36-11-11-36-11 36-36 11z" opacity="0.9"/>
    <path d="M1086 480l9 28 9-28 28-9-28-9-9-28-9 28-28 9z" opacity="0.85"/>
    <path d="M1219 585l13 40 13-40 40-13-40-13-13-40-13 40-40 13z" opacity="0.9"/>
    <path d="M395 532l5 17 5-17 17-5-17-5-5-17-5 17-17 5z" opacity="0.72"/>
    <path d="M1140 532l5 17 5-17 17-5-17-5-5-17-5 17-17 5z" opacity="0.72"/>
  </g>

  <path d="M267 612c145-92 318-141 501-141s356 49 501 141" fill="none" stroke="#6e3f09" stroke-width="16" opacity="0.55"/>
  <path d="M267 602c145-92 318-141 501-141s356 49 501 141" fill="none" stroke="url(#arcGold)" stroke-width="12"/>
  <path d="M287 594c137-79 301-123 481-123s344 44 481 123" fill="none" stroke="#fff1a9" stroke-width="4" opacity="0.85"/>

  <text x="768" y="763" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="500" fill="url(#goldText)" stroke="#8a4f09" stroke-width="4" paint-order="stroke fill" filter="url(#textShadow)">God Dome</text>
  <text x="768" y="763" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="172" font-weight="500" fill="none" stroke="#fff5be" stroke-width="1.5" opacity="0.85">God Dome</text>
</svg>
